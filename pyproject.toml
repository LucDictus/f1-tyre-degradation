[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-tyre-degradation"
version = "0.1.0"
description = "Formula 1 tyre degradation analysis using Openf1 data."
authors = [{ name = "LucDictus", email = "lucdictus161@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "statsmodels",
    "matplotlib",
    "requests",
]

[project.scripts]
tyredeg = "tyredeg.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "responses",
]

[tool.ruff]
line-length = 100
src = ["src"]
